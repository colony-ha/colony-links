<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909"><title>Join COLONY LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--panel:#12110e;--gold:#d6b45b;--gold2:#f0d58b;--text:#f7f4ec;--muted:#aaa394;--line:rgba(214,180,91,.23)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,rgba(174,129,38,.17),transparent 43%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column}body[lang=ar]{font-family:'Cairo',sans-serif}.top{height:78px;width:min(1100px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;text-decoration:none;color:var(--text)}.mark{width:36px;height:36px;border:1px solid var(--gold);border-radius:11px;display:grid;place-items:center;color:var(--gold);font:24px Georgia}.brand b{color:var(--gold)}.lang{background:#17150f;color:var(--gold2);border:1px solid var(--line);border-radius:30px;padding:9px 14px;cursor:pointer}.main{flex:1;display:grid;place-items:center;padding:35px 18px 55px}.card{width:min(455px,100%);padding:34px;background:linear-gradient(145deg,rgba(27,25,19,.98),rgba(14,14,12,.98));border:1px solid var(--line);border-radius:25px;box-shadow:0 25px 90px #0009}.eyebrow{text-align:center;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:3px}.logo{text-align:center;font:700 31px 'Playfair Display',Georgia,serif;margin:10px 0 4px}.logo span{color:var(--gold2)}h1{text-align:center;font-size:25px;margin:10px 0 6px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 25px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#090909;border:1px solid #ffffff12;border-radius:13px;margin-bottom:22px}.tab{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:linear-gradient(135deg,#f0d58b,#bd9237);color:#17130a}.field{display:block;margin:0 0 15px;font-size:12px;font-weight:700;color:#ded8c8}.field input{display:block;width:100%;margin-top:7px;padding:13px 14px;border-radius:11px;border:1px solid #ffffff20;background:#0a0a09;color:var(--text);font:14px 'DM Sans',sans-serif;outline:none}.field input:focus{border-color:var(--gold)}.primary{width:100%;border:0;border-radius:30px;padding:14px;background:linear-gradient(135deg,#f0d58b,#bd9237);color:#17130a;font-weight:800;cursor:pointer;margin-top:3px}.divider{display:flex;align-items:center;gap:12px;color:#817b6e;font-size:11px;margin:19px 0}.divider:before,.divider:after{content:'';height:1px;background:#ffffff18;flex:1}.google{width:100%;padding:12px;border:1px solid var(--line);border-radius:30px;background:#ffffff05;color:var(--text);font-weight:700;cursor:pointer}.under{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 0}.under a{color:var(--gold2);text-decoration:none}.notice{display:none;margin-top:15px;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--gold2);font-size:12px;text-align:center;line-height:1.6}.foot{text-align:center;color:#6f6a60;font-size:11px;padding:18px}.back{color:var(--muted);text-decoration:none;font-size:12px}.back:hover{color:var(--gold2)}[hidden]{display:none!important}@media(max-width:480px){.card{padding:25px 20px}.top{height:68px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./"><span class="mark">C</span><span>COLONY <b>LINKS</b></span></a><button class="lang" id="langBtn" type="button">EN ⌄</button></header>
<main class="main"><section class="card">
<div class="eyebrow">CREATE · CONNECT · GROW</div><div class="logo">COLONY <span>LINKS</span></div>
<h1 id="heading">Create your account</h1><p class="sub" id="subtitle">Your links deserve a beautiful home.</p>
<div class="tabs"><button class="tab active" id="signupTab" type="button">Sign up</button><button class="tab" id="loginTab" type="button">Log in</button></div>
<form id="authForm">
<label class="field" id="nameWrap">Full name<input id="name" type="text" autocomplete="name" placeholder="Your name"></label>
<label class="field">Email address<input type="email" required autocomplete="email" placeholder="you@example.com"></label>
<label class="field">Password<input type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label>
<label class="field" id="confirmWrap">Confirm password<input type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your password"></label>
<button class="primary" id="submitBtn" type="submit">Create account</button>
</form>
<div class="under" id="forgotWrap" hidden><a href="#" id="forgot">Forgot your password?</a></div>
<div class="divider" id="orText">OR</div><button class="google" id="googleBtn" type="button">◎ &nbsp; Continue with Google</button>
<div class="notice" id="notice" role="status"></div>
<p class="under"><a class="back" href="./">← Back to COLONY LINKS</a></p>
</section></main><footer class="foot">© <span id="year"></span> COLONY LINKS. All rights reserved.</footer>
<script>
const copy={
en:{headingUp:"Create your account",headingIn:"Welcome back",subUp:"Your links deserve a beautiful home.",subIn:"Log in to manage your page.",signup:"Sign up",login:"Log in",name:"Full name",email:"Email address",password:"Password",confirm:"Confirm password",placeholderName:"Your name",placeholderEmail:"you@example.com",placeholderPass:"At least 8 characters",placeholderConfirm:"Repeat your password",create:"Create account",enter:"Log in",forgot:"Forgot your password?",or:"OR",google:"◎  Continue with Google",back:"← Back to COLONY LINKS",notice:"This is the account page preview. Secure sign-up, Google login and password recovery will be connected in the next development step.",reset:"Password recovery will be connected when account security is set up."},
fr:{headingUp:"Créer votre compte",headingIn:"Bon retour",subUp:"Offrez à vos liens un bel espace.",subIn:"Connectez-vous pour gérer votre page.",signup:"S'inscrire",login:"Connexion",name:"Nom complet",email:"Adresse e-mail",password:"Mot de passe",confirm:"Confirmer le mot de passe",placeholderName:"Votre nom",placeholderEmail:"vous@exemple.com",placeholderPass:"Au moins 8 caractères",placeholderConfirm:"Répétez le mot de passe",create:"Créer mon compte",enter:"Se connecter",forgot:"Mot de passe oublié ?",or:"OU",google:"◎  Continuer avec Google",back:"← Retour à COLONY LINKS",notice:"Aperçu de la page de compte. L'inscription sécurisée, Google et la récupération du mot de passe seront connectés à la prochaine étape.",reset:"La récupération sera activée lors de la configuration de la sécurité des comptes."},
ar:{headingUp:"أنشئ حسابك",headingIn:"مرحباً بعودتك",subUp:"امنح روابطك مساحة أنيقة تجمعها.",subIn:"سجّل الدخول لإدارة صفحتك.",signup:"إنشاء حساب",login:"تسجيل الدخول",name:"الاسم الكامل",email:"البريد الإلكتروني",password:"كلمة المرور",confirm:"تأكيد كلمة المرور",placeholderName:"اكتب اسمك",placeholderEmail:"name@example.com",placeholderPass:"8 أحرف على الأقل",placeholderConfirm:"أعد كتابة كلمة المرور",create:"إنشاء الحساب",enter:"دخول",forgot:"هل نسيت كلمة المرور؟",or:"أو",google:"◎  المتابعة باستخدام Google",back:"← العودة إلى COLONY LINKS",notice:"هذه معاينة لواجهة الحسابات. سنربط التسجيل الآمن وGoogle واسترجاع كلمة المرور في الخطوة البرمجية القادمة.",reset:"سنفعّل استرجاع كلمة المرور بعد إعداد نظام أمان الحسابات."}
};
let lang=localStorage.getItem("colony-links-lang")||"en";if(!copy[lang])lang="en";let mode="signup";
const $=id=>document.getElementById(id);
function render(){const t=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.lang=lang; $("langBtn").textContent=({en:"EN ⌄",fr:"FR ⌄",ar:"عربي ⌄"})[lang];$("heading").textContent=mode==="signup"?t.headingUp:t.headingIn;$("subtitle").textContent=mode==="signup"?t.subUp:t.subIn;$("signupTab").textContent=t.signup;$("loginTab").textContent=t.login;$("signupTab").classList.toggle("active",mode==="signup");$("loginTab").classList.toggle("active",mode==="login");$("nameWrap").firstChild.textContent=t.name;$("authForm").querySelectorAll(".field")[1].firstChild.textContent=t.email;$("authForm").querySelectorAll(".field")[2].firstChild.textContent=t.password;$("confirmWrap").firstChild.textContent=t.confirm;$("name").placeholder=t.placeholderName;$("authForm").querySelector('input[type=email]').placeholder=t.placeholderEmail;$("authForm").querySelector('input[type=password]').placeholder=t.placeholderPass;$("confirmWrap").querySelector("input").placeholder=t.placeholderConfirm;$("nameWrap").hidden=mode==="login";$("confirmWrap").hidden=mode==="login";$("forgotWrap").hidden=mode!=="login";$("forgot").textContent=t.forgot;$("submitBtn").textContent=mode==="signup"?t.create:t.enter;$("orText").textContent=t.or;$("googleBtn").textContent=t.google;$("notice").textContent=t.notice;$("backLink");document.querySelector(".back").textContent=t.back}
$("signupTab").onclick=()=>{mode="signup";$("notice").style.display="none";render()};$("loginTab").onclick=()=>{mode="login";$("notice").style.display="none";render()};$("langBtn").onclick=()=>{lang=({en:"fr",fr:"ar",ar:"en"})[lang];localStorage.setItem("colony-links-lang",lang);render()};
function showNotice(message, isError=false){$("notice").style.display="block";$("notice").style.color=isError?"#ff9b9b":"var(--gold2)";$("notice").textContent=message}
$("authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const fields=$("authForm").querySelectorAll("input");
  const name=$("name").value.trim();
  const email=fields[1].value.trim();
  const password=fields[2].value;
  const confirm=fields[3].value;
  const t=copy[lang];
  if(mode==="signup" && password!==confirm){showNotice(lang==="ar"?"كلمتا المرور غير متطابقتين.":lang==="fr"?"Les mots de passe ne correspondent pas.":"Passwords do not match.",true);return}
  if(mode==="signup" && !name){showNotice(lang==="ar"?"يرجى إدخال الاسم الكامل.":lang==="fr"?"Veuillez saisir votre nom complet.":"Please enter your full name.",true);return}
  const button=$("submitBtn");
  button.disabled=true;
  button.textContent=lang==="ar"?"يرجى الانتظار...":lang==="fr"?"Veuillez patienter...":"Please wait...";
  try{
    const endpoint=mode==="signup"?"/api/auth/sign-up/email":"/api/auth/sign-in/email";
    const payload=mode==="signup"?{name,email,password}:{email,password,rememberMe:true};
    const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(payload)});
    const result=await response.json().catch(()=>({}));
    if(!response.ok){
      const message=result.message||result.error?.message|| (lang==="ar"?"تعذر إتمام العملية. تحقق من البيانات وحاول مجدداً.":lang==="fr"?"Impossible de terminer. Vérifiez vos informations et réessayez.":"Unable to complete the request. Check your details and try again.");
      showNotice(message,true);
      return;
    }
    showNotice(mode==="signup"?(lang==="ar"?"تم إنشاء حسابك بنجاح! أصبحت مسجّل الدخول.":lang==="fr"?"Compte créé avec succès ! Vous êtes connecté.":"Account created successfully! You are now signed in."):(lang==="ar"?"تم تسجيل الدخول بنجاح!":lang==="fr"?"Connexion réussie !":"Logged in successfully!"));
  }catch(error){
    showNotice(lang==="ar"?"تعذر الاتصال بالخادم. حاول مرة أخرى.":lang==="fr"?"Impossible de joindre le serveur. Réessayez.":"Could not reach the server. Please try again.",true);
  }finally{
    button.disabled=false;
    button.textContent=mode==="signup"?t.create:t.enter;
  }
});
$("googleBtn").onclick=()=>showNotice(lang==="ar"?"تسجيل Google غير مفعّل بعد.":lang==="fr"?"La connexion Google n'est pas encore activée.":"Google sign-in is not enabled yet.");
$("forgot").onclick=e=>{e.preventDefault();$("notice").style.display="block";$("notice").textContent=copy[lang].reset};
$("year").textContent=new Date().getFullYear();render();
</script></body></html>
