<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909"><meta name="description" content="A COLONY LINKS profile page.">
<title>COLONY LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--accent:#d6b45b;--gold2:#f0d58b;--text:#f7f4ec;--muted:#aaa394;--line:color-mix(in srgb,var(--accent) 28%,transparent)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:30px 16px}body[lang=ar]{font-family:'Cairo',sans-serif}.card{width:min(430px,100%);text-align:center;padding:34px 27px 27px;border:1px solid var(--accent);border-radius:26px;background:linear-gradient(150deg,#1b1913,#0e0e0c 65%);box-shadow:0 25px 90px #000b}.avatar{width:94px;height:94px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#413319,#17130b);border:2px solid var(--accent);color:var(--accent);font:38px 'Playfair Display',Georgia,serif}.name{font:700 27px 'Playfair Display',Georgia,serif;margin:0}.handle{font-size:13px;color:var(--gold2);margin:6px 0 14px}.bio{font-size:13px;color:var(--muted);line-height:1.7;margin:0 auto 22px;overflow-wrap:anywhere}.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:0 auto 22px}.social-link{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--accent);border-radius:50%;background:#ffffff0b;color:var(--accent);font-size:19px;text-decoration:none;transition:transform .15s,background .15s}.social-link:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--accent) 18%,transparent)}.links{display:grid;gap:11px}.link{display:flex;align-items:center;gap:12px;text-align:start;text-decoration:none;padding:13px 16px;border:1px solid var(--accent);border-radius:13px;background:var(--accent);color:#17130a;font-weight:800;font-size:14px;transition:transform .15s}.link-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:9px;background:#17130a18;font-size:17px;overflow:hidden}.link-icon img{width:100%;height:100%;object-fit:cover}.link-label{min-width:0;overflow-wrap:anywhere}.link:hover{transform:translateY(-2px)}.empty{font-size:13px;color:var(--muted);padding:17px 0}.colony-site-logo{width:48px;height:48px;object-fit:contain;display:inline-block;vertical-align:middle;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(214,180,91,.22));transition:filter .2s ease,transform .2s ease}.brand:hover .colony-site-logo{filter:drop-shadow(0 0 15px rgba(214,180,91,.4));transform:scale(1.04)}.brand{display:inline-flex;align-items:center;gap:7px;margin-top:27px;color:#8d8575;text-decoration:none;font-size:10px;letter-spacing:2px;font-weight:800}.brand b{color:var(--gold)}.error{color:var(--muted);padding:35px 0}.loading{color:var(--gold2)}.foot{font-size:10px;color:#6f695d;margin-top:13px}.style-glow{background:radial-gradient(ellipse at 50% 8%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 45%),var(--bg)}.style-gradient{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 25%,var(--bg)),var(--bg) 72%)}.style-plain{background:var(--bg)}.avatar img{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
.template-minimal .card{background:#fbf8f1;color:#25231e;border:1px solid #d8d0c0;box-shadow:0 25px 80px #0005}.template-minimal .name{color:#25231e}.template-minimal .handle{color:#77623a}.template-minimal .bio{color:#716b60}.template-minimal .link{background:#25231e;color:#fbf8f1;border-color:#25231e;border-radius:8px}.template-minimal .brand{color:#77623a}
.template-aurora .card{background:linear-gradient(145deg,#17142d,#0d1022 65%);border-color:#9b8cff;box-shadow:0 25px 90px #5e45c755}.template-aurora .avatar{border-color:#9b8cff;color:#d8d0ff;background:#282044}.template-aurora .handle{color:#c3b8ff}.template-aurora .link{background:linear-gradient(100deg,#8b7cf6,#57c8d4);border:0;color:#111026;border-radius:999px}
.template-glass .card{background:linear-gradient(145deg,#ffffff1c,#ffffff08);backdrop-filter:blur(18px);border-color:#ffffff55;box-shadow:0 25px 90px #0008}.template-glass .link{background:#ffffff16;color:#f7f4ec;border-color:#ffffff66;backdrop-filter:blur(10px)}.template-glass .avatar{background:#ffffff18;border-color:#ffffff88}
.template-signature .card{width:min(500px,100%);padding:48px 34px 36px;border:2px solid #d6b45b;border-radius:4px;background:linear-gradient(145deg,#201a0e,#090909 70%);box-shadow:0 25px 100px #000b}.template-signature .name{font-size:34px;letter-spacing:.3px}.template-signature .avatar{width:112px;height:112px;border-radius:26px}.template-signature .link{border-radius:4px;letter-spacing:.4px;background:transparent;color:#f0d58b}.template-signature .brand{color:#d6b45b}

/* Responsive public profile card sizing */
body{padding:16px 12px}
.card{width:min(560px,100%);padding:38px 30px 30px}
@media(max-width:600px){
  body{padding:12px 10px;min-height:100svh}
  .card{width:100%;max-width:none;padding:30px 22px 24px;border-radius:24px}
  .avatar{width:104px;height:104px;margin-bottom:18px}
  .name{font-size:30px}
  .handle{font-size:15px}
  .bio{font-size:15px;margin-bottom:24px}
  .links{gap:13px}
  .link{padding:16px 17px;min-height:68px;font-size:16px}
  .link-icon{width:40px;height:40px;flex-basis:40px;font-size:19px}
  .brand{margin-top:24px}
}
@media(max-width:360px){
  .card{padding:25px 16px 20px}
  .link{padding:13px 14px;font-size:15px}
}

</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/Luxury%20Colony%20Links%20Hub.png">
</head>
<body>
<main class="card" id="card"><div class="loading">Loading profile…</div></main>
<script>
const card=document.getElementById("card");
const username=new URLSearchParams(location.search).get("username")||"";
function safeText(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const iconClasses={website:"fa-solid fa-globe",instagram:"fa-brands fa-instagram",facebook:"fa-brands fa-facebook-f",tiktok:"fa-brands fa-tiktok",whatsapp:"fa-brands fa-whatsapp",youtube:"fa-brands fa-youtube",telegram:"fa-brands fa-telegram",x:"fa-brands fa-x-twitter",linkedin:"fa-brands fa-linkedin-in",snapchat:"fa-brands fa-snapchat",pinterest:"fa-brands fa-pinterest-p",google_maps:"fa-solid fa-map-location-dot",spotify:"fa-brands fa-spotify",discord:"fa-brands fa-discord",twitch:"fa-brands fa-twitch",reddit:"fa-brands fa-reddit-alien",github:"fa-brands fa-github",threads:"fa-brands fa-threads",medium:"fa-brands fa-medium",behance:"fa-brands fa-behance",dribbble:"fa-brands fa-dribbble",soundcloud:"fa-brands fa-soundcloud",email:"fa-solid fa-envelope",phone:"fa-solid fa-phone",link:"fa-solid fa-link",calendar:"fa-solid fa-calendar",location:"fa-solid fa-location-dot",shop:"fa-solid fa-store",music:"fa-solid fa-music",camera:"fa-solid fa-camera",heart:"fa-solid fa-heart",star:"fa-solid fa-star",user:"fa-solid fa-user",message:"fa-solid fa-comment",custom:"fa-solid fa-image"};
async function load(){
 if(!/^[a-z0-9_]{3,24}$/i.test(username)){card.innerHTML='<div class="error">Invalid profile address.</div>';return}
 try{
  const response=await fetch("/api/public/profile/"+encodeURIComponent(username.toLowerCase()),{cache:"no-store"});
  const data=await response.json();
  if(!response.ok||!data.success){card.innerHTML='<div class="error">This COLONY LINKS page does not exist yet.</div><a class="brand" href="/"><img class="colony-site-logo" src="Luxury%20Colony%20Links%20Hub.png" alt="COLONY LINKS logo"><span>CREATE YOUR PAGE · <b>COLONY LINKS</b></span></a>';return}
  const profile=data.profile;
  const name=profile.display_name||profile.username;
  const backgroundColor=/^#[0-9a-f]{6}$/i.test(profile.background_color||"")?profile.background_color:"#090909";
  const accentColor=/^#[0-9a-f]{6}$/i.test(profile.accent_color||"")?profile.accent_color:"#d6b45b";
  const backgroundStyle=["glow","plain","gradient"].includes(profile.background_style)?profile.background_style:"glow";
  document.documentElement.style.setProperty("--bg",backgroundColor);
  document.documentElement.style.setProperty("--accent",accentColor);
  document.body.classList.add("style-"+backgroundStyle);
  const templateKey=["classic","minimal","aurora","glass","signature"].includes(profile.template_key)?profile.template_key:"classic";
  document.body.classList.add("template-"+templateKey);
  const avatar=profile.avatarUrl?'<img src="'+safeText(profile.avatarUrl)+'" alt="">':safeText(name.trim().charAt(0).toUpperCase()||"C");
  const links=(data.links||[]).map(link=>{
   let target=String(link.url||"");let parsed;
   try{parsed=new URL(target,location.origin)}catch{return ""}
   if(!["http:","https:","mailto:","tel:"].includes(parsed.protocol))return "";
   const detectIconFromUrl=(value)=>{try{const host=new URL(value).hostname.toLowerCase().replace(/^www\\./,"");const rules=[[/instagram\\.com$/,"instagram"],[/facebook\\.com$|fb\\.com$/,"facebook"],[/tiktok\\.com$/,"tiktok"],[/wa\\.me$|whatsapp\\.com$/,"whatsapp"],[/youtube\\.com$|youtu\\.be$/,"youtube"],[/t\\.me$|telegram\\.me$/,"telegram"],[/x\\.com$|twitter\\.com$/,"x"],[/linkedin\\.com$/,"linkedin"],[/snapchat\\.com$/,"snapchat"],[/pinterest\\.com$|pin\\.it$/,"pinterest"],[/maps\\.google\\.|maps\\.app\\.goo\\.gl$/,"google_maps"],[/spotify\\.com$/,"spotify"],[/discord\\.com$|discord\\.gg$/,"discord"],[/twitch\\.tv$/,"twitch"],[/reddit\\.com$/,"reddit"],[/github\\.com$/,"github"],[/threads\\.net$/,"threads"],[/medium\\.com$/,"medium"],[/behance\\.net$/,"behance"],[/dribbble\\.com$/,"dribbble"],[/soundcloud\\.com$/,"soundcloud"]];return rules.find(([pattern])=>pattern.test(host))?.[1]||""}catch{return ""}};
   const platformKey=link.platform||"website";
   const savedIcon=link.icon||"";
   const iconKey=savedIcon&&savedIcon!=="website"&&savedIcon!=="link"?savedIcon:(platformKey!=="website"?platformKey:(savedIcon||detectIconFromUrl(target)||"website"));
   const icon=link.custom_icon?'<img src="'+safeText(link.custom_icon)+'" alt="">':'<i class="'+(iconClasses[iconKey]||"fa-solid fa-link")+'" aria-hidden="true"></i>';
   const href=["http:","https:"].includes(parsed.protocol)?"/api/public/click/"+encodeURIComponent(link.id):target;
   const external=["http:","https:"].includes(parsed.protocol);
   return '<a class="link" href="'+safeText(href)+'" '+(external?'target="_blank" rel="noopener noreferrer"':'')+'><span class="link-icon">'+icon+'</span><span class="link-label">'+safeText(link.title)+'</span></a>';
  }).join("");
  document.title=safeText(name)+" · COLONY LINKS";
  document.documentElement.lang="en";
  card.innerHTML='<div class="avatar">'+avatar+'</div><h1 class="name">'+safeText(name)+'</h1><div class="handle">@'+safeText(profile.username)+'</div><p class="bio">'+safeText(profile.bio||"")+'</p><div class="links">'+(links||'<div class="empty">Links will appear here soon.</div>')+'</div><a class="brand" href="/">CREATE · CONNECT · GROW <b>COLONY LINKS</b></a>';
 }catch(error){card.innerHTML='<div class="error">Could not load this page. Please try again later.</div>'}
}
load();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
</body>
</html>
