<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909"><title>Admin — COLONY LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--panel:#12110e;--gold:#d6b45b;--gold2:#f0d58b;--text:#f7f4ec;--muted:#aaa394;--line:rgba(214,180,91,.23)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,rgba(174,129,38,.13),transparent 42%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}body[lang=ar]{font-family:'Cairo',sans-serif}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1160px)/2));background:#090909b8}.brand{font-weight:800;letter-spacing:2px}.brand b{color:var(--gold)}.right{display:flex;gap:10px;align-items:center}.btn,.lang{border:1px solid var(--line);border-radius:30px;padding:10px 15px;background:#17150f;color:var(--gold2);cursor:pointer;font-weight:700}.wrap{width:min(1160px,calc(100% - 36px));margin:36px auto}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:3px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:12px 0 25px}h1{font:700 34px 'Playfair Display',Georgia,serif;margin:0}.muted{color:var(--muted);font-size:13px;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat,.panel{background:linear-gradient(145deg,rgba(27,25,19,.96),rgba(14,14,12,.98));border:1px solid var(--line);border-radius:18px;padding:20px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font:700 27px 'Playfair Display',Georgia,serif;color:var(--gold2);margin-top:8px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.panel h2{font-size:17px;margin:0}.search{width:min(360px,100%);padding:12px 14px;background:#090909;border:1px solid #ffffff20;border-radius:11px;color:var(--text);outline:none}.search:focus{border-color:var(--gold)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:start;padding:14px 12px;border-bottom:1px solid #ffffff12;font-size:13px}th{color:var(--gold2);font-size:11px;letter-spacing:1px;text-transform:uppercase}td{color:#e8e2d5}.email{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;color:var(--muted);font-size:12px}.pager{display:flex;gap:8px}.pager button:disabled{opacity:.35;cursor:not-allowed}.notice{display:none;margin:15px 0;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--gold2);font-size:13px}.loading{text-align:center;color:var(--muted);padding:40px}[hidden]{display:none!important}@media(max-width:650px){.stats{grid-template-columns:1fr}.wrap{margin:24px auto}h1{font-size:29px}}
</style></head>
<body>
<header><div class="brand">COLONY <b>LINKS</b> <span style="color:#827b6b;font-size:10px;letter-spacing:2px">/ ADMIN</span></div><div class="right"><button class="lang" id="langBtn">EN</button><button class="btn" id="logoutBtn">Log out</button></div></header>
<main class="wrap" id="app" hidden>
<div class="eyebrow">CONTROL CENTER</div><div class="heading"><div><h1 id="title">Admin dashboard</h1><div class="muted" id="welcome">Manage COLONY LINKS users and accounts.</div></div></div>
<div class="stats"><div class="stat"><small id="totalLabel">Total accounts</small><strong id="totalUsers">—</strong></div><div class="stat"><small id="pageLabel">Current page</small><strong id="pageNumber">1</strong></div><div class="stat"><small id="adminLabel">Signed in as</small><strong id="adminEmail" style="font:600 14px 'DM Sans',sans-serif;overflow-wrap:anywhere">—</strong></div></div>
<div class="notice" id="notice"></div>
<section class="panel"><div class="panel-head"><h2 id="usersTitle">User accounts</h2><input class="search" id="searchInput" type="search" placeholder="Search by name or email…"></div>
<div class="table-wrap"><table><thead><tr><th id="nameHead">Name</th><th id="emailHead">Email</th><th id="dateHead">Created</th><th id="actionsHead">Actions</th></tr></thead><tbody id="usersBody"><tr><td colspan="4" class="empty">Loading users…</td></tr></tbody></table></div>
<div class="bottom"><span id="countText">Loading…</span><div class="pager"><button class="btn" id="prevBtn" disabled>←</button><button class="btn" id="nextBtn" disabled>→</button></div></div>
</section>
</main><div class="loading" id="loading">Verifying administrator access…</div>
<script>
const $=id=>document.getElementById(id);let lang=localStorage.getItem("colony-links-lang")||"en";if(!["en","fr","ar"].includes(lang))lang="en";let page=1,total=0,query="",searchTimer;
const words={
en:{title:"Admin dashboard",welcome:"Manage COLONY LINKS users and accounts.",total:"Total accounts",page:"Current page",admin:"Signed in as",users:"User accounts",actions:"Actions",edit:"Edit name",remove:"Delete",disable:"Disable",enable:"Enable",confirmStatus:"Change this account status?",confirmDelete:"Delete this account permanently?",newName:"Enter the new display name:",saved:"User name updated.",deleted:"User account deleted.",search:"Search by name or email…",name:"Name",email:"Email",date:"Created",loading:"Loading users…",empty:"No users found.",count:(a,b,c)=>"Showing "+a+"–"+b+" of "+c+" users",prev:"← Previous",next:"Next →",logout:"Log out",denied:"You do not have administrator access.",failed:"Could not load users. Please refresh and try again."},
fr:{title:"Tableau de bord admin",welcome:"Gérez les utilisateurs et les comptes COLONY LINKS.",total:"Comptes au total",page:"Page actuelle",admin:"Connecté en tant que",users:"Comptes utilisateurs",actions:"Actions",edit:"Modifier le nom",remove:"Supprimer",disable:"Désactiver",enable:"Réactiver",confirmStatus:"Modifier le statut de ce compte ?",confirmDelete:"Supprimer définitivement ce compte ?",newName:"Saisissez le nouveau nom :",saved:"Nom mis à jour.",deleted:"Compte supprimé.",search:"Rechercher par nom ou e-mail…",name:"Nom",email:"E-mail",date:"Créé le",loading:"Chargement…",empty:"Aucun utilisateur trouvé.",count:(a,b,c)=>"Affichage de "+a+"–"+b+" sur "+c+" utilisateurs",prev:"← Précédent",next:"Suivant →",logout:"Déconnexion",denied:"Vous n'avez pas accès à l'administration.",failed:"Impossible de charger les utilisateurs."},
ar:{title:"لوحة تحكم المدير",welcome:"إدارة مستخدمي وحسابات COLONY LINKS.",total:"إجمالي الحسابات",page:"الصفحة الحالية",admin:"تم الدخول بواسطة",users:"حسابات المستخدمين",actions:"الإجراءات",edit:"تعديل الاسم",remove:"حذف",disable:"تعطيل",enable:"إعادة التفعيل",confirmStatus:"هل تريد تغيير حالة هذا الحساب؟",confirmDelete:"هل تريد حذف هذا الحساب نهائياً؟",newName:"أدخل الاسم الجديد:",saved:"تم تحديث الاسم.",deleted:"تم حذف الحساب.",search:"ابحث بالاسم أو البريد الإلكتروني…",name:"الاسم",email:"البريد الإلكتروني",date:"تاريخ الإنشاء",loading:"جارٍ تحميل المستخدمين…",empty:"لا توجد حسابات.",count:(a,b,c)=>"عرض "+a+"–"+b+" من أصل "+c+" مستخدم",prev:"← السابق",next:"التالي →",logout:"تسجيل الخروج",denied:"ليس لديك صلاحية دخول لوحة الإدارة.",failed:"تعذر تحميل المستخدمين. حدّث الصفحة وحاول مجدداً."}
};
function renderText(){const t=words[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.lang=lang;$("langBtn").textContent=lang.toUpperCase();$("title").textContent=t.title;$("welcome").textContent=t.welcome;$("totalLabel").textContent=t.total;$("pageLabel").textContent=t.page;$("adminLabel").textContent=t.admin;$("usersTitle").textContent=t.users;$("searchInput").placeholder=t.search;$("nameHead").textContent=t.name;$("emailHead").textContent=t.email;$("dateHead").textContent=t.date;$("actionsHead").textContent=t.actions;$("logoutBtn").textContent=t.logout;$("prevBtn").textContent=t.prev;$("nextBtn").textContent=t.next}
function notice(message){$("notice").style.display="block";$("notice").textContent=message}
async function loadUsers(){const t=words[lang];$("usersBody").innerHTML='<tr><td colspan="3" class="empty">'+t.loading+'</td></tr>';try{const params=new URLSearchParams({page:String(page),q:query});const response=await fetch("/api/admin/users?"+params,{credentials:"same-origin",cache:"no-store"});const data=await response.json();if(!response.ok)throw new Error(data.message||"load");total=data.total||0;$("totalUsers").textContent=total.toLocaleString();$("pageNumber").textContent=String(page);const users=data.users||[];if(!users.length){$("usersBody").innerHTML='<tr><td colspan="3" class="empty">'+t.empty+'</td></tr>'}else{$("usersBody").innerHTML=users.map(user=>'<tr><td>'+escapeHtml(user.name||"—")+'</td><td class="email">'+escapeHtml(user.email||"")+'</td><td>'+formatDate(user.createdAt)+'</td><td><button class="btn user-action" data-action="edit" data-id="'+escapeHtml(user.id)+'">'+t.edit+'</button> <button class="btn user-action" data-action="status" data-disabled="'+(Number(user.isDisabled)===1?'1':'0')+' data-id="'+escapeHtml(user.id)+'">'+(Number(user.isDisabled)===1?t.enable:t.disable)+'</button> <button class="btn user-action" data-action="delete" data-id="'+escapeHtml(user.id)+'">'+t.remove+'</button></td></tr>').join("")}const first=total?((page-1)*25+1):0,last=Math.min(page*25,total);$("countText").textContent=t.count(first,last,total);$("prevBtn").disabled=page<=1;$("nextBtn").disabled=page*25>=total}catch(error){notice(t.failed)}}
$("usersBody").addEventListener("click",async event=>{const button=event.target.closest("button.user-action");if(!button)return;const id=button.dataset.id;const action=button.dataset.action;const t=words[lang];if(action==="edit"){const current=button.closest("tr").querySelector("td").textContent;const name=prompt(t.newName,current);if(name===null||!name.trim())return;try{const response=await fetch("/api/admin/users/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({name:name.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.message||"update");notice(t.saved);await loadUsers()}catch(error){notice(error.message||t.failed)}}else if(action==="status"){if(!confirm(t.confirmStatus))return;const disabled=button.dataset.disabled!=="1";try{const response=await fetch("/api/admin/users/"+encodeURIComponent(id)+"/status",{method:"PUT",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({disabled})});const data=await response.json();if(!response.ok)throw new Error(data.message||"status");notice(disabled?t.disable+" ✓":t.enable+" ✓");await loadUsers()}catch(error){notice(error.message||t.failed)}}else if(action==="delete"){if(!confirm(t.confirmDelete))return;try{const response=await fetch("/api/admin/users/"+encodeURIComponent(id),{method:"DELETE",credentials:"same-origin"});const data=await response.json();if(!response.ok)throw new Error(data.message||"delete");notice(t.deleted);await loadUsers()}catch(error){notice(error.message||t.failed)}}});
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function formatDate(value){if(!value)return "—";const d=new Date(value);return Number.isNaN(d.getTime())?escapeHtml(value):d.toLocaleDateString(lang==="ar"?"ar-DZ":lang==="fr"?"fr-FR":"en-US")}
async function init(){renderText();try{const response=await fetch("/api/admin/me",{credentials:"same-origin",cache:"no-store"});const data=await response.json();if(!response.ok||!data.isAdmin){if(response.status===401)location.replace("signup.html");else{ $("loading").textContent=words[lang].denied; }return}$("adminEmail").textContent=data.admin.email;$("loading").hidden=true;$("app").hidden=false;await loadUsers()}catch(error){$("loading").textContent=words[lang].denied}}
$("searchInput").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=$("searchInput").value.trim();page=1;loadUsers()},250)});
$("prevBtn").onclick=()=>{if(page>1){page--;loadUsers()}};$("nextBtn").onclick=()=>{if(page*25<total){page++;loadUsers()}};
$("langBtn").onclick=()=>{lang=({en:"fr",fr:"ar",ar:"en"})[lang];localStorage.setItem("colony-links-lang",lang);renderText();if(!$("app").hidden)loadUsers()};
$("logoutBtn").onclick=async()=>{try{await fetch("/api/auth/sign-out",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:"{}"})}finally{location.replace("signup.html")}};
init();
</script></body></html>
